name: Python Package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries for OpenCV
        # The desktop build needs libGL and libgthread even when nothing opens
        # a window. Paying for them is deliberate: the headless wheel ships
        # cv2/data as an empty package -- no haarcascade XML at all -- so
        # CameraManager cannot load the face cascade and every import of the
        # app fails. The GUI build is the one that carries the data files.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Real errors only: syntax problems and undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        # Note what this runner does not have. models/ holds ~134 MB of
        # third-party weights fetched by fetch_models.py, and dataset/ holds
        # captured images of real people -- both gitignored, the second
        # deliberately so. The handful of tests that need those weights skip
        # rather than fail, which is what makes this runnable at all.
        run: pytest -q -rs
