[pytest]
# Collect from tests/ only.
#
# The scripts in tools/ are scripts, not tests, and one of them was named
# tools_scale_test.py back when it sat in the project root -- which matches
# pytest's default *_test.py pattern, so pytest imported it, and importing it
# ran a benchmark that expected a multi-gigabyte corpus. It is now
# tools/scale_benchmark.py, and this keeps the next tool from tripping the
# same wire wherever it lands.
testpaths = tests
