[pytest]
# Collect from tests/ only.
#
# The tools in the project root are scripts, not tests, and one of them was
# named tools_scale_test.py -- which matches pytest's default *_test.py
# pattern, so pytest imported it, and importing it ran a benchmark that
# expected a multi-gigabyte corpus. It has been renamed, and this keeps the
# next tool from tripping the same wire.
testpaths = tests
