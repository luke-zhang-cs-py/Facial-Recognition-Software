# mutmut only: nothing else here reads setup.cfg (pytest reads pytest.ini,
# coverage reads .coveragerc). Run by .github/workflows/mutation.yml -- mutmut
# does not run on native Windows.
#
# Keys are mutmut 3.8's. 3.x renamed `paths_to_mutate` to `source_paths` and
# folded `tests_dir` into `pytest_add_cli_args_test_selection`; the old names
# still load, with a deprecation warning. The workflow pins the version these
# were checked against.
[mutmut]
# What mutmut copies into mutants/, where the tests run against it. The tests
# import across the packages, so all of them go in; `only_mutate` below picks
# what is actually mutated.
source_paths =
    app.py
    analysis/
    cli/
    core/
    pipeline/

# The rules a surviving mutant would hurt most: the attendance decision, the
# liveness vote, the one-mark-per-day database, and the threshold maths.
only_mutate =
    pipeline/decision.py
    pipeline/liveness.py
    core/db.py
    analysis/calibration.py

# mutmut runs pytest from inside mutants/, so everything a test reads has to be
# there too: the tests, the page and templates they check, the configs.
also_copy =
    tests/
    templates/
    static/
    docs/
    tools/
    notes/
    .github/
    pytest.ini
    .coveragerc
    requirements.txt
    README.md
    LICENSE
    .gitignore

pytest_add_cli_args_test_selection =
    tests/

# test_published_figures compares line and statement counts against the page,
# and a mutated (trampolined) file is longer than the one the page describes,
# so it would fail every clean run. It tests the page, not these four modules.
pytest_add_cli_args =
    -p
    no:cacheprovider
    --ignore=tests/test_published_figures.py
